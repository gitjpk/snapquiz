openapi: 3.0.3
info:
  title: SnapQuiz Live Sessions API
  version: 0.1.0
  description: |
    HTTP APIs for quiz management and live session lifecycle.
    Real-time gameplay state is delivered via WebSocket events (see asyncapi.yaml).
servers:
  - url: http://localhost:3000
paths:
  /api/quizzes:
    get:
      summary: List quizzes
      responses:
        '200':
          description: List of quizzes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Quiz'
    post:
      summary: Create a quiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuizRequest'
      responses:
        '201':
          description: Quiz created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quiz'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/quizzes/{quizId}:
    get:
      summary: Get a quiz
      parameters:
        - $ref: '#/components/parameters/QuizId'
      responses:
        '200':
          description: Quiz
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a quiz
      parameters:
        - $ref: '#/components/parameters/QuizId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuizRequest'
      responses:
        '200':
          description: Quiz updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quiz'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sessions:
    post:
      summary: Create a live session from a quiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/sessions/by-pin/{pin}:
    get:
      summary: Resolve a session by PIN
      parameters:
        - name: pin
          in: path
          required: true
          schema:
            type: string
            example: '123456'
      responses:
        '200':
          description: Session summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sessions/{sessionId}/join:
    post:
      summary: Join a live session
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinSessionRequest'
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sessions/{sessionId}/answer:
    post:
      summary: Submit an answer for the current question
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswerRequest'
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitAnswerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sessions/{sessionId}/control:
    post:
      summary: Host control action (start/next/reveal/leaderboard/end)
      description: |
        Host-only control endpoint. Specific actions are handled by a typed request.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostControlRequest'
      responses:
        '200':
          description: Control action accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    QuizId:
      name: quizId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: Invalid PIN

    Quiz:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true

    QuizDetail:
      allOf:
        - $ref: '#/components/schemas/Quiz'
        - type: object
          required: [questions]
          properties:
            questions:
              type: array
              items:
                $ref: '#/components/schemas/Question'

    Question:
      type: object
      required: [id, prompt, timeLimitSeconds, options]
      properties:
        id:
          type: string
        prompt:
          type: string
        timeLimitSeconds:
          type: integer
          example: 20
        media:
          $ref: '#/components/schemas/Media'
        options:
          type: array
          minItems: 2
          maxItems: 6
          items:
            $ref: '#/components/schemas/AnswerOption'

    Media:
      type: object
      nullable: true
      properties:
        type:
          type: string
          enum: [image, video]
        url:
          type: string
          format: uri

    AnswerOption:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string

    CreateQuizRequest:
      type: object
      required: [title, questions]
      properties:
        title:
          type: string
        description:
          type: string
        questions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateQuestionRequest'

    CreateQuestionRequest:
      type: object
      required: [prompt, timeLimitSeconds, options, correctOptionIndex]
      properties:
        prompt:
          type: string
        timeLimitSeconds:
          type: integer
        media:
          $ref: '#/components/schemas/Media'
        options:
          type: array
          minItems: 2
          maxItems: 6
          items:
            type: string
        correctOptionIndex:
          type: integer
          minimum: 0

    UpdateQuizRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        questions:
          type: array
          items:
            $ref: '#/components/schemas/CreateQuestionRequest'

    CreateSessionRequest:
      type: object
      required: [quizId]
      properties:
        quizId:
          type: string
        leaderboardTopN:
          type: integer
          default: 5

    CreateSessionResponse:
      type: object
      required: [sessionId, pin, joinUrl]
      properties:
        sessionId:
          type: string
        pin:
          type: string
          example: '123456'
        joinUrl:
          type: string
          format: uri

    SessionSummary:
      type: object
      required: [sessionId, status, participantCount]
      properties:
        sessionId:
          type: string
        status:
          type: string
          enum: [lobby, in_progress, ended]
        participantCount:
          type: integer

    JoinSessionRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
          example: Alex

    JoinSessionResponse:
      type: object
      required: [participantId, nickname]
      properties:
        participantId:
          type: string
        nickname:
          type: string

    SubmitAnswerRequest:
      type: object
      required: [participantId, questionId, selectedOptionId]
      properties:
        participantId:
          type: string
        questionId:
          type: string
        selectedOptionId:
          type: string

    SubmitAnswerResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          example: true

    HostControlRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [start_game, next_question, reveal_answer, show_leaderboard, end_game]

    HostControlResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true
